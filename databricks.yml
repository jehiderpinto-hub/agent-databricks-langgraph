bundle:
  name: agent_langgraph

resources:
  apps:
    agent_langgraph:
      name: "agent-langgraph"
      description: "LangGraph agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: GENIE_SPACE_IDS
            value: "01f14fd31b731643881aa99b62170b4a"
          # Default Unity Catalog volume for generate_pdf_to_volume /
          # generate_pdf_from_genie (agent_server/tools/pdf.py). "unset" (the
          # default) disables those tools until a real volume is configured
          # here -- calls that pass their own target_volume/volume_path/
          # catalog+schema+volume still work without this. Once set, also add
          # a matching 'pdf_target_volume' uc_securable resource below with
          # WRITE_VOLUME permission.
          - name: PDF_TARGET_VOLUME
            value: "unset"
          # Logic App mail (agent_server/tools/mail.py) is disabled until
          # this is set -- see the setup guide in that file's docstring.
          # Prefer a Databricks secret over a literal value here:
          #   - name: LOGIC_APP_MAIL_URL
          #     value_from: "logic_app_mail_url"  # -> secrets block, not shown

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "3871103648862313"
            permission: 'CAN_MANAGE'
        - name: 'sql_warehouse'
          sql_warehouse:
            id: '6fadc34945c1c177'
            permission: 'CAN_USE'
        - name: 'genie_space'
          genie_space:
            name: 'genie_space'
            space_id: '01f14fd31b731643881aa99b62170b4a'
            permission: 'CAN_RUN'
        # Uncomment once PDF_TARGET_VOLUME above points to a real volume:
        # - name: 'pdf_target_volume'
        #   uc_securable:
        #     securable_full_name: '<catalog>.<schema>.<volume>'
        #     securable_type: 'VOLUME'
        #     permission: 'WRITE_VOLUME'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_langgraph:
          name: agent-langgraph
