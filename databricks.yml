bundle:
  name: agent_langgraph

resources:
  apps:
    agent_langgraph:
      name: "agent-langgraph"
      description: "LangGraph agent application"
      source_code_path: ./
      # On-behalf-of-user auth (see agent_server/agent.py: stream_handler).
      # Every MCP call and every local tool touching Unity Catalog
      # (generate_pdf_to_volume/_from_genie) runs with the calling user's
      # permissions using these scopes -- NOT the service principal's.
      # [Public Preview] Requires a workspace admin to approve the app's
      # requested scopes once (Databricks Apps -> this app -> Authorization)
      # before on-behalf-of-user calls succeed; until approved (or if a
      # request carries no forwarded user token, e.g. local dev), those tools
      # fall back to the service principal.
      user_api_scopes:
        - sql
        - genie
        - files
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: MODEL_ENDPOINT
            value: "https://adb-2339714903823198.18.azuredatabricks.net/serving-endpoints/databricks-claude-haiku-4-5/invocations"
          - name: MODEL_MAX_TOKENS
            value: "800"
          - name: DEFAULT_GENIE_SPACE_ID
            value: "01f14fd31b731643881aa99b62170b4a"
          - name: GENIE_SPACE_IDS
            value: "01f14fd31b731643881aa99b62170b4a"
          - name: EMAIL_DELIVERY_JOB_ID
            value: "1043398432719286"
          # Default Unity Catalog volume for generate_pdf_to_volume /
          # generate_pdf_from_genie (agent_server/tools/pdf.py). Calls that
          # pass their own target_volume/volume_path/catalog+schema+volume
          # still override this.
          - name: PDF_TARGET_VOLUME
            value: "/Volumes/slv_dev/star_generico/test_mcp"
          # Email delivery is handled by the Databricks job referenced in
          # EMAIL_DELIVERY_JOB_ID. Grant the app's service principal
          # permission on that job directly in the workspace.

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "3871103648862313"
            permission: 'CAN_MANAGE'
        - name: 'sql_warehouse'
          sql_warehouse:
            id: '6fadc34945c1c177'
            permission: 'CAN_USE'
        - name: 'genie_space'
          genie_space:
            name: 'genie_space'
            space_id: '01f14fd31b731643881aa99b62170b4a'
            permission: 'CAN_RUN'
        # Otorgaría WRITE_VOLUME al service principal como fallback (usado
        # solo si el on-behalf-of-user de arriba no aplica). Deshabilitado:
        # la identidad que despliega el bundle no tiene USE CATALOG ni MANAGE
        # en 'slv_dev' (403 al desplegar). Pide a un admin de catálogo que
        # ejecute, y luego descomenta este bloque:
        #   GRANT WRITE VOLUME ON VOLUME slv_dev.star_generico.test_mcp
        #     TO `<service-principal-id-de-la-app>`;
        # - name: 'pdf_target_volume'
        #   uc_securable:
        #     securable_full_name: 'slv_dev.star_generico.test_mcp'
        #     securable_type: 'VOLUME'
        #     permission: 'WRITE_VOLUME'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_langgraph:
          name: agent-langgraph
